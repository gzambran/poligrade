services:
  position-parser:
    build: ./server
    container_name: position-parser
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "80"]
    volumes:
      - ./server/cache:/app/cache
      - ./server/logs:/app/logs
    env_file:
      - ./server/.env
    networks:
      - shared
    healthcheck:
      # curl isn't installed in the python:3.12-slim image, so a curl-based check
      # always fails regardless of actual app health. Use Python's stdlib instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  shared:
    external: true
