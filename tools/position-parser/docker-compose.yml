services:
  position-parser:
    build: ./server
    container_name: position-parser
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./server/cache:/app/cache
    env_file:
      - ./server/.env
    healthcheck:
      # curl isn't installed in the python:3.12-slim image, so a curl-based check
      # always fails regardless of actual app health. Use Python's stdlib instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
